<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>端口控制台</title>
<style>
  :root{
    --bg:#0b0d0f;
    --bg-soft:#0e1113;
    --panel:#131719;
    --panel-2:#171c1f;
    --line:#232a2e;
    --line-soft:#1b2226;
    --text:#e8edf2;
    --muted:#8a949c;
    --dim:#5c666e;
    --green:#3fb950;
    --green-soft:rgba(63,185,80,.12);
    --amber:#d29922;
    --red:#f85149;
    --blue:#58a6ff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:
      radial-gradient(1000px 500px at 78% -12%, rgba(63,185,80,.07), transparent 62%),
      radial-gradient(760px 420px at 12% -8%, rgba(88,166,255,.05), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",Arial,sans-serif;
    font-size:14px;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .mono{font-family:"SF Mono",ui-monospace,Menlo,Monaco,Consolas,monospace;font-variant-numeric:tabular-nums}

  /* ---------------- 顶栏 ---------------- */
  .topbar{
    position:sticky;top:0;z-index:20;
    background:rgba(11,13,15,.82);
    backdrop-filter:saturate(180%) blur(14px);
    border-bottom:1px solid var(--line-soft);
  }
  .topbar-inner{
    max-width:1180px;margin:0 auto;padding:14px 22px;
    display:flex;align-items:center;gap:18px;flex-wrap:wrap;
  }
  .brand{display:flex;align-items:center;gap:10px;min-width:0}
  .brand-mark{
    width:30px;height:30px;border-radius:8px;flex:none;
    background:linear-gradient(160deg,#1c2620,#12171a);
    border:1px solid #2b3538;display:grid;place-items:center;
  }
  .brand-mark svg{width:16px;height:16px;opacity:.9}
  .brand h1{font-size:16px;font-weight:600;margin:0;letter-spacing:.2px;white-space:nowrap}
  .brand .sub{font-size:11.5px;color:var(--dim);white-space:nowrap}

  .stats{display:flex;align-items:center;gap:10px;margin-left:auto;flex-wrap:wrap}
  .stat{
    display:flex;align-items:baseline;gap:6px;
    padding:5px 11px;border:1px solid var(--line-soft);border-radius:7px;
    background:var(--bg-soft);
  }
  .stat b{font-size:15px;font-weight:600}
  .stat span{font-size:11.5px;color:var(--muted)}
  .stat.run b{color:var(--green)}
  .stat.stop b{color:var(--dim)}

  .btns{display:flex;align-items:center;gap:8px}
  .btn{
    appearance:none;border:1px solid var(--line);border-radius:8px;
    background:var(--panel-2);color:var(--text);
    padding:8px 13px;font-size:12.5px;font-family:inherit;cursor:pointer;
    transition:background .15s,border-color .15s,transform .05s,opacity .15s;
    display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
  }
  .btn:hover{background:#1d2429;border-color:#2e383d}
  .btn:active{transform:translateY(1px)}
  .btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
  .btn-primary{background:var(--green);border-color:var(--green);color:#08130b;font-weight:600}
  .btn-primary:hover{background:#49c25c;border-color:#49c25c}
  .btn-danger{background:transparent;border-color:rgba(248,81,73,.5);color:#ff8b84}
  .btn-danger:hover{background:rgba(248,81,73,.1);border-color:var(--red)}
  .btn-ghost{background:transparent;border-color:transparent;color:var(--muted);padding:7px 9px}
  .btn-ghost:hover{background:var(--panel-2);color:var(--text)}

  /* ---------------- 工具条 ---------------- */
  .toolbar{
    max-width:1180px;margin:0 auto;padding:18px 22px 12px;
    display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  }
  .search{
    position:relative;flex:1;min-width:200px;max-width:320px;
  }
  .search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:14px;height:14px;opacity:.45}
  .search input{
    width:100%;background:var(--panel);border:1px solid var(--line);border-radius:8px;
    color:var(--text);font-family:inherit;font-size:13px;padding:9px 12px 9px 32px;outline:none;
  }
  .search input:focus{border-color:#33424a;background:#151a1d}
  .search input::placeholder{color:var(--dim)}
  .filters{display:flex;align-items:center;gap:14px;font-size:11.5px;color:var(--muted)}
  .filters label{display:flex;align-items:center;gap:5px;cursor:pointer;user-select:none;white-space:nowrap}
  .filters input{accent-color:var(--green);width:13px;height:13px;margin:0;cursor:pointer}
  .hint{margin-left:auto;font-size:11.5px;color:var(--dim);white-space:nowrap}
  .hint kbd{
    font-family:"SF Mono",ui-monospace,Menlo,monospace;font-size:10.5px;
    border:1px solid var(--line);border-radius:4px;padding:1px 5px;background:var(--panel);
    color:var(--muted);
  }

  /* ---------------- 卡片网格 ---------------- */
  .grid{
    max-width:1180px;margin:0 auto;padding:4px 22px 40px;
    display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px;
  }
  .card{
    position:relative;background:linear-gradient(180deg,var(--panel-2),var(--panel));
    border:1px solid var(--line);border-radius:12px;padding:15px 16px 14px;
    transition:border-color .18s,box-shadow .18s;
    overflow:hidden;
  }
  .card:hover{border-color:#2e3a40;box-shadow:0 8px 26px rgba(0,0,0,.32)}
  .card[data-status="running"]{border-color:#22362a}
  .card[data-status="running"]:hover{border-color:#2c4a37;box-shadow:0 10px 30px rgba(0,0,0,.36)}
  .card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--line)}
  .card[data-status="running"]::before{background:linear-gradient(180deg,var(--green),rgba(63,185,80,.15))}
  .card[data-status="starting"]::before{background:var(--amber)}

  .card-head{display:flex;align-items:center;gap:9px;margin-bottom:10px;min-width:0}
  .dot{width:8px;height:8px;border-radius:50%;background:#3a444a;flex:none}
  .card[data-status="running"] .dot{background:var(--green);box-shadow:0 0 0 3px rgba(63,185,80,.14)}
  .card[data-status="starting"] .dot{background:var(--amber);animation:pulse 1.1s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
  .card-name{font-size:14.5px;font-weight:600;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .port{
    margin-left:auto;flex:none;font-size:12.5px;color:#9fb0bb;
    background:#0e1214;border:1px solid var(--line-soft);border-radius:6px;padding:2px 7px;
  }
  .card[data-status="running"] .port{color:var(--green);border-color:#22362a;background:#0d1511}

  .meta{display:flex;align-items:center;gap:8px;margin-bottom:11px;flex-wrap:wrap;min-height:18px}
  .pill{
    font-size:11px;border-radius:999px;padding:2.5px 9px;border:1px solid var(--line);
    color:var(--muted);background:#101417;letter-spacing:.2px;
  }
  .pill.running{color:#7ee089;border-color:#234c30;background:var(--green-soft)}
  .pill.starting{color:#e3b341;border-color:#4b3a12;background:rgba(210,153,34,.1)}
  .pill.stopped{color:var(--dim);border-color:var(--line);background:#101417}
  .proc{font-size:11.5px;color:var(--muted)}

  .cmd{
    display:block;font-family:"SF Mono",ui-monospace,Menlo,monospace;font-size:11.5px;
    color:#c9d6df;background:#0d1113;border:1px solid var(--line-soft);border-radius:7px;
    padding:7px 9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .cwd{
    display:flex;align-items:center;gap:6px;margin:7px 0 13px;
    font-size:11px;color:var(--dim);font-family:"SF Mono",ui-monospace,Menlo,monospace;
    overflow:hidden;
  }
  .cwd span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .note{font-size:11.5px;color:var(--muted);margin:-4px 0 10px;line-height:1.5}

  .actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
  .act{
    appearance:none;font-family:inherit;font-size:11.5px;cursor:pointer;
    border-radius:7px;padding:6px 6px;border:1px solid var(--line);
    background:#151a1d;color:#c3ced6;transition:all .14s;
    display:inline-flex;align-items:center;justify-content:center;gap:5px;
    white-space:nowrap;min-height:30px;box-sizing:border-box;
  }
  .act:hover{background:#1b2227;border-color:#303b41;color:#fff}
  .act:disabled{opacity:.34;cursor:not-allowed;filter:grayscale(1)}
  .act.start{background:var(--green);border-color:var(--green);color:#07130a;font-weight:600}
  .act.start:hover:not(:disabled){background:#49c25c;border-color:#49c25c}
  .act.stop{color:#ff8f88;border-color:rgba(248,81,73,.4);background:transparent}
  .act.stop:hover:not(:disabled){background:rgba(248,81,73,.1);border-color:var(--red)}
  .act.act-log{color:var(--muted)}
  .act.act-log:hover{color:var(--text)}
  .act.fol{display:inline-flex;align-items:center;gap:5px;color:#c3ced6}
  .act.fol svg{opacity:.7;flex:none}

  .empty{
    grid-column:1/-1;border:1px dashed var(--line);border-radius:12px;
    padding:56px 20px;text-align:center;color:var(--muted);
  }
  .empty h2{font-size:15px;margin:0 0 8px;color:var(--text);font-weight:600}
  .empty p{margin:0;font-size:12.5px;line-height:1.8;color:var(--dim)}
  .empty code{color:#9fb0bb;font-family:"SF Mono",Menlo,monospace}

  /* ---------------- 日志抽屉 ---------------- */
  .overlay{
    position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(2px);
    opacity:0;pointer-events:none;transition:opacity .2s;z-index:40;
  }
  .overlay.on{opacity:1;pointer-events:auto}
  .drawer{
    position:fixed;right:0;top:0;bottom:0;width:min(680px,92vw);z-index:50;
    background:var(--bg-soft);border-left:1px solid var(--line);
    transform:translateX(102%);transition:transform .24s cubic-bezier(.4,0,.2,1);
    display:flex;flex-direction:column;
  }
  .drawer.on{transform:translateX(0)}
  .drawer-head{
    display:flex;align-items:center;gap:10px;padding:15px 18px;border-bottom:1px solid var(--line-soft);
  }
  .drawer-head h2{margin:0;font-size:14px;font-weight:600}
  .drawer-head .port{font-size:12px}
  .drawer-head .close{margin-left:0}
  .log{
    flex:1;margin:0;padding:14px 18px;overflow:auto;
    font-family:"SF Mono",ui-monospace,Menlo,Monaco,monospace;font-size:11.5px;line-height:1.7;
    color:#b9c6cf;white-space:pre-wrap;word-break:break-all;background:#090c0d;
  }
  .log-empty{color:var(--dim);font-family:inherit;font-size:12.5px}
  .drawer-foot{
    padding:9px 18px;border-top:1px solid var(--line-soft);font-size:11px;color:var(--dim);
    display:flex;gap:8px;align-items:center;
  }
  .drawer-foot .live{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 1.4s infinite}

  /* ---------------- 提示 ---------------- */
  #toast{
    position:fixed;left:50%;bottom:26px;transform:translate(-50%,16px);
    background:#1a2024;border:1px solid var(--line);border-radius:9px;
    padding:10px 16px;font-size:12.5px;color:var(--text);max-width:min(620px,90vw);
    box-shadow:0 12px 36px rgba(0,0,0,.5);opacity:0;pointer-events:none;
    transition:opacity .18s,transform .18s;z-index:60;line-height:1.6;
  }
  #toast.on{opacity:1;transform:translate(-50%,0)}
  #toast.err{border-color:rgba(248,81,73,.45);color:#ffb3ad}

  @media (max-width:760px){
    .topbar-inner{padding:12px 16px;gap:12px}
    .stats{display:none}
    .grid{padding:4px 16px 32px;grid-template-columns:1fr}
    .toolbar{padding:14px 16px 10px;gap:10px}
    .hint{display:none}
    .btns{width:100%;justify-content:flex-end}
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 16 16" fill="none" stroke="#3fb950" stroke-width="1.4" stroke-linecap="round">
          <path d="M2 3h12M2 8h8M2 13h5"/>
        </svg>
      </div>
      <h1>端口控制台</h1>
      <span class="sub" id="hostInfo">127.0.0.1</span>
    </div>

    <div class="stats">
      <div class="stat run"><b id="cntRunning">0</b><span>运行中</span></div>
      <div class="stat stop"><b id="cntStopped">0</b><span>已停止</span></div>
      <div class="stat"><b id="cntList">0</b><span>清单</span></div>
    </div>

    <div class="btns">
      <button class="btn btn-primary" id="btnAllStart" title="启动所有已停止的服务">全部启动</button>
      <button class="btn btn-danger" id="btnAllStop" title="停止所有正在运行的服务">全部停止</button>
    </div>
  </div>
</header>

<div class="toolbar">
  <div class="search">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
      <circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/>
    </svg>
    <input id="search" type="search" placeholder="按名称、端口、命令搜索…" autocomplete="off" spellcheck="false">
  </div>
  <div class="filters">
    <label><input type="checkbox" id="optHideSys" checked> 隐藏 1024 以下</label>
  </div>
  <div class="hint">每 4 秒自动刷新 · <kbd>/</kbd> 聚焦搜索 · <kbd>Esc</kbd> 关闭日志</div>
</div>

<main class="grid" id="grid">
  <div class="empty">
    <h2>正在扫描本机端口…</h2>
    <p>同时读取清单文件 <code>services.json</code>。</p>
  </div>
</main>

<div class="overlay" id="overlay"></div>

<section class="drawer" id="drawer" aria-hidden="true">
  <div class="drawer-head">
    <h2 id="logTitle">日志</h2>
    <span class="port mono" id="logPort"></span>
    <button class="btn btn-ghost close" id="logClose">关闭</button>
  </div>
  <pre class="log" id="logBody"></pre>
  <div class="drawer-foot"><span class="live"></span><span>实时跟随输出 · 最多显示最近 400 行</span></div>
</section>

<div id="toast"></div>

<script>
'use strict';

const grid = document.getElementById('grid');
const toastEl = document.getElementById('toast');
const searchEl = document.getElementById('search');
const drawer = document.getElementById('drawer');
const overlay = document.getElementById('overlay');
const logBody = document.getElementById('logBody');
const logTitle = document.getElementById('logTitle');
const logPort = document.getElementById('logPort');
const optHideSys = document.getElementById('optHideSys');

const FOLDER_ICON =
  '<svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" ' +
  'stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round">' +
  '<path d="M1.8 4.8h3.9l1.3 1.5h6.4v6.2a1 1 0 0 1-1 1H2.8a1 1 0 0 1-1-1V4.8z"/>' +
  '<path d="M1.8 4.8V3.6a1 1 0 0 1 1-1h2.9l1.3 1.5"/></svg>';

const cards = new Map();
let itemsByKey = new Map();
let lastItems = [];
let busy = false;
let logTimer = null;
let openLogId = null;
let lastSig = '';
let autoLogDone = false;
const AUTO_LOG = new URLSearchParams(location.search).get('log');

const STATUS_LABEL = { running: '运行中', starting: '启动中', stopped: '已停止' };

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  }[c]));
}

function toast(msg, isError) {
  toastEl.textContent = msg;
  toastEl.className = isError ? 'on err' : 'on';
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { toastEl.className = ''; }, isError ? 5200 : 2600);
}

/* ------------------------------ 卡片 ------------------------------ */

function buildCard(key) {
  const el = document.createElement('article');
  el.className = 'card';
  el.dataset.key = key;
  el.dataset.status = 'stopped';
  el.innerHTML = [
    '<div class="card-head">',
    '  <span class="dot"></span>',
    '  <h3 class="card-name"></h3>',
    '  <span class="port mono"></span>',
    '</div>',
    '<div class="meta">',
    '  <span class="pill stopped"></span>',
    '  <span class="proc mono"></span>',
    '</div>',
    '<div class="note" hidden></div>',
    '<code class="cmd"></code>',
    '<div class="cwd"><span></span></div>',
    '<div class="actions"></div>',
  ].join('');

  el._refs = {
    name: el.querySelector('.card-name'),
    port: el.querySelector('.port'),
    pill: el.querySelector('.pill'),
    proc: el.querySelector('.proc'),
    note: el.querySelector('.note'),
    cmd: el.querySelector('.cmd'),
    cwd: el.querySelector('.cwd span'),
    actions: el.querySelector('.actions'),
  };

  el.addEventListener('click', (ev) => {
    const btn = ev.target.closest('button[data-act]');
    if (!btn || btn.disabled) return;
    const item = itemsByKey.get(key);
    if (!item) return;
    const act = btn.dataset.act;

    if (act === 'logs') return openLogs(item.id);
    if (act === 'open') return window.open(item.url, '_blank', 'noopener');
    if (act === 'reveal') return revealItem(item);
    if (act === 'kill') return killPort(item.port, item.name);
    runAction(item.id, act);
  });

  return el;
}

function actionsHtml(item) {
  const d = (cond) => (cond ? '' : ' disabled');

  if (!item.id) {
    // 极少数兜底情况：端口还没同步进清单，只给「停止」和「访达」
    return [
      '<button class="act stop" data-act="kill">停止</button>',
      `<button class="act fol" data-act="reveal" title="在访达中打开项目文件夹"${d(item.cwd)}>${FOLDER_ICON}<span>访达</span></button>`,
    ].join('');
  }

  return [
    `<button class="act start" data-act="start"${d(item.status === 'stopped')}>启动</button>`,
    `<button class="act stop" data-act="stop"${d(item.status !== 'stopped')}>停止</button>`,
    `<button class="act" data-act="restart"${d(item.status !== 'stopped')}>重启</button>`,
    `<button class="act" data-act="open"${d(item.status === 'running' && item.url)}>打开</button>`,
    '<button class="act act-log" data-act="logs">日志</button>',
    `<button class="act fol" data-act="reveal" title="在访达中打开项目文件夹"${d(item.cwd)}>${FOLDER_ICON}<span>访达</span></button>`,
  ].join('');
}

function updateCard(item) {
  let el = cards.get(item.key);
  if (!el) {
    el = buildCard(item.key);
    cards.set(item.key, el);
  }
  const r = el._refs;
  el.dataset.status = item.status;
  el.dataset.kind = item.kind;

  r.name.textContent = item.name;
  r.name.title = item.name;
  r.port.textContent = ':' + item.port;

  r.cmd.textContent = item.command || '';
  r.cmd.title = item.command || '';
  r.cwd.textContent = item.cwd || '项目目录未知';
  r.cwd.title = item.cwd || '';

  r.pill.className = 'pill ' + item.status;
  r.pill.textContent = STATUS_LABEL[item.status] || item.status;

  if (item.status === 'running') {
    r.proc.textContent = item.pid ? `PID ${item.pid}${item.uptime ? ' · ' + item.uptime : ''}` : '';
  } else if (item.status === 'starting') {
    r.proc.textContent = item.pid ? `PID ${item.pid} · 等待端口就绪` : '等待端口就绪';
  } else {
    r.proc.textContent = '未监听';
  }

  if (item.note) {
    r.note.hidden = false;
    r.note.textContent = item.note;
  } else {
    r.note.hidden = true;
  }

  const asig = [
    item.kind, item.status, !!item.cwd, !!item.url, busy ? 1 : 0,
  ].join('|');
  if (el._asig !== asig) {
    el._asig = asig;
    r.actions.innerHTML = actionsHtml(item);
  }

  return el;
}

function render(items) {
  lastItems = items;
  itemsByKey = new Map(items.map((i) => [i.key, i]));

  const hideSys = optHideSys.checked;
  const kw = searchEl.value.trim().toLowerCase();

  const visible = items.filter((i) => {
    if (hideSys && i.port < 1024) return false;
    if (!kw) return true;
    return `${i.name} ${i.port} ${i.command} ${i.cwd || ''}`.toLowerCase().includes(kw);
  });

  const running = items.filter((i) => i.status === 'running').length;
  const listCount = items.filter((i) => i.id).length;
  document.getElementById('cntRunning').textContent = running;
  document.getElementById('cntStopped').textContent = items.length - running;
  document.getElementById('cntList').textContent = listCount;
  document.getElementById('btnAllStart').disabled = busy || listCount === 0;
  document.getElementById('btnAllStop').disabled = busy || listCount === 0;

  grid.querySelectorAll('.empty').forEach((e) => e.remove());

  if (!visible.length) {
    const d = document.createElement('div');
    d.className = 'empty';
    d.innerHTML = items.length
      ? '<h2>没有匹配的端口</h2><p>换个关键词，或取消勾选「隐藏 1024 以下」。</p>'
      : '<h2>没有发现监听端口</h2><p>确认后端还在运行，或稍等几秒刷新。</p>';
    grid.appendChild(d);
  }

  const frag = visible.map(updateCard);
  frag.forEach((el, i) => {
    if (grid.children[i] !== el) grid.insertBefore(el, grid.children[i] || null);
  });

  const keep = new Set(visible.map((i) => i.key));
  for (const [key, el] of cards) {
    if (!keep.has(key)) {
      el.remove();
      cards.delete(key);
    }
  }
}

/* ------------------------------ 数据请求 ------------------------------ */

async function refresh(force) {
  if (busy) return;
  try {
    const scanRes = await fetch('/api/scan', { cache: 'no-store' });
    const scanJson = await scanRes.json();
    if (!scanJson.ok) throw new Error(scanJson.error || '扫描端口失败');

    // scan 会先把新出现的监听端口并进清单，所以 state 放到后面取
    const stateRes = await fetch('/api/state', { cache: 'no-store' });
    const stateJson = await stateRes.json();
    if (!stateJson.ok) throw new Error(stateJson.error || '读取清单失败');

    document.getElementById('hostInfo').textContent = `127.0.0.1:${stateJson.data.consolePort}`;

    const items = [];
    for (const s of stateJson.data.services) {
      items.push({
        kind: 'service', key: 's:' + s.id, id: s.id, name: s.name,
        port: s.port, status: s.status, pid: s.pid, uptime: s.uptime,
        command: s.command, cwd: s.cwd, url: s.url, note: s.note,
      });
    }
    for (const p of scanJson.data.ports) {
      if (p.managedId) continue;
      items.push({
        kind: 'port', key: 'p:' + p.port, id: null,
        name: p.process || `端口 ${p.port}`,
        port: p.port, status: 'running', pid: p.pid, uptime: p.uptime,
        command: p.command, cwd: p.cwd, url: null, note: '',
      });
    }

    const sig = JSON.stringify(items.map((i) => [i.key, i.status, i.pid, i.uptime, i.command, i.cwd]));
    if (!force && sig === lastSig) return;
    lastSig = sig;
    render(items);

    if (!autoLogDone && AUTO_LOG && cards.has('s:' + AUTO_LOG)) {
      autoLogDone = true;
      openLogs(AUTO_LOG);
    }
  } catch (e) {
    toast(e.message || '连不上后端，确认 node server.mjs 还在跑', true);
  }
}

async function runAction(id, action) {
  if (busy) return;
  setBusy(true);
  try {
    const res = await fetch('/api/action', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id, action }),
    });
    const json = await res.json();
    if (!json.ok) throw new Error(json.error || '操作失败');
    const d = json.data || {};
    if (action === 'start' && d.timeout) {
      toast('进程已启动，但端口在超时时间内没有就绪，去日志里看看');
    } else if (action === 'stop' && d.already) {
      toast('该服务本来就没有在运行');
    }
  } catch (e) {
    toast(e.message || '操作失败', true);
  } finally {
    setBusy(false);
    lastSig = '';
    await refresh(true);
  }
}

async function runAll(action) {
  if (busy) return;
  const services = lastItems.filter((i) => i.id);
  const running = services.filter((i) => i.status === 'running').length;
  const stopped = services.length - running;

  if (action === 'start' && stopped === 0) {
    toast('所有服务都在运行，没有需要启动的');
    return;
  }
  if (action === 'stop' && running === 0) {
    toast('当前没有正在运行的服务');
    return;
  }
  if (action === 'stop' &&
      !window.confirm(`将停止 ${running} 个正在运行的服务（包括 ControlCenter、Doubao 等系统进程），确定？`)) {
    return;
  }

  setBusy(true);
  try {
    const res = await fetch('/api/all', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action }),
    });
    const json = await res.json();
    if (!json.ok) throw new Error(json.error || '操作失败');
    const results = json.data.results || [];
    const fails = results.filter((r) => !r.ok);
    const acted = results.filter((r) => !r.skipped && r.ok).length;
    if (fails.length) {
      toast(`${acted} 个成功，${fails.length} 个失败：` +
        fails.map((f) => `${f.id}（${f.error}）`).join('；'), true);
    } else {
      toast(action === 'start' ? `已启动 ${acted} 个服务` : `已停止 ${acted} 个服务`);
    }
  } catch (e) {
    toast(e.message || '操作失败', true);
  } finally {
    setBusy(false);
    lastSig = '';
    await refresh(true);
  }
}

function setBusy(v) {
  busy = v;
  document.getElementById('btnAllStart').disabled = v;
  document.getElementById('btnAllStop').disabled = v;
  for (const btn of grid.querySelectorAll('button[data-act]')) btn.disabled = v;
}

async function revealItem(item) {
  try {
    const res = await fetch('/api/reveal', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(item.kind === 'service'
        ? { kind: 'service', id: item.id }
        : { kind: 'port', port: item.port }),
    });
    const json = await res.json();
    if (!json.ok) throw new Error(json.error || '打开文件夹失败');
    toast(`已在访达打开：${json.data.dir}`);
  } catch (e) {
    toast(e.message, true);
  }
}

async function killPort(port, name) {
  if (!window.confirm(`停止端口 ${port}（${name}）上的进程？`)) return;
  try {
    const res = await fetch('/api/scan/kill', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ port }),
    });
    const json = await res.json();
    if (!json.ok) throw new Error(json.error || '停止失败');
    toast(json.data.already ? `端口 ${port} 本来就没有进程` : `已停止端口 ${port}`);
    lastSig = '';
    await refresh(true);
  } catch (e) {
    toast(e.message, true);
  }
}

/* -------------------------------- 日志 -------------------------------- */

async function fetchLog() {
  if (!openLogId) return;
  try {
    const res = await fetch(`/api/logs?id=${encodeURIComponent(openLogId)}&lines=400`, { cache: 'no-store' });
    const json = await res.json();
    if (!json.ok) throw new Error(json.error || '读取日志失败');
    const d = json.data;
    if (!d.exists) {
      logBody.innerHTML = '<span class="log-empty">还没有日志，先启动一次这个服务。</span>';
      return;
    }
    const nearBottom = logBody.scrollHeight - logBody.scrollTop - logBody.clientHeight < 40;
    logBody.textContent = d.text || '（空）';
    if (nearBottom) logBody.scrollTop = logBody.scrollHeight;
  } catch (e) {
    logBody.innerHTML = `<span class="log-empty">${escapeHtml(e.message)}</span>`;
  }
}

function openLogs(id) {
  if (!id) return;
  const item = itemsByKey.get('s:' + id);
  openLogId = id;
  logTitle.textContent = (item ? item.name : id) + ' · 日志';
  logPort.textContent = item ? ':' + item.port : '';
  drawer.classList.add('on');
  overlay.classList.add('on');
  drawer.setAttribute('aria-hidden', 'false');
  logBody.innerHTML = '<span class="log-empty">加载中…</span>';
  fetchLog();
  clearInterval(logTimer);
  logTimer = setInterval(fetchLog, 1500);
}

function closeLogs() {
  openLogId = null;
  drawer.classList.remove('on');
  overlay.classList.remove('on');
  drawer.setAttribute('aria-hidden', 'true');
  clearInterval(logTimer);
  logTimer = null;
}

/* -------------------------------- 事件 -------------------------------- */

document.getElementById('btnAllStart').addEventListener('click', () => runAll('start'));
document.getElementById('btnAllStop').addEventListener('click', () => runAll('stop'));
document.getElementById('logClose').addEventListener('click', closeLogs);
overlay.addEventListener('click', closeLogs);

let searchTimer = null;
searchEl.addEventListener('input', () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => render(lastItems), 120);
});

optHideSys.addEventListener('change', () => render(lastItems));

document.addEventListener('keydown', (e) => {
  if (e.key === '/' && document.activeElement !== searchEl) {
    e.preventDefault();
    searchEl.focus();
  }
  if (e.key === 'Escape') {
    if (openLogId) closeLogs();
    else if (document.activeElement === searchEl) searchEl.blur();
  }
});

/* -------------------------------- 启动 -------------------------------- */
refresh(true);
setInterval(() => { if (!busy) refresh(false); }, 4000);
</script>
