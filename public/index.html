<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>端口控制台</title>
<style>
:root {
  color-scheme: dark light;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;

  --ease-out: cubic-bezier(.23, 1, .32, 1);
  --ease-in-out: cubic-bezier(.77, 0, .175, 1);
  --ease-drawer: cubic-bezier(.32, .72, 0, 1);

  --bg: #0b0a08;
  --surface: #13110e;
  --surface-2: #181510;
  --surface-3: #1f1b15;
  --ink: #f3ede2;
  --ink-2: #b3aa9c;
  --ink-3: #948a7d;
  --line: rgba(243, 237, 226, .12);
  --line-soft: rgba(243, 237, 226, .075);
  --line-strong: rgba(243, 237, 226, .22);
  --running: #86e7a8;
  --running-soft: rgba(134, 231, 168, .11);
  --danger: #ff8273;
  --danger-ink: #1b0d0a;
  --danger-soft: rgba(255, 130, 115, .10);
  --amber: #e8b76a;
  --amber-soft: rgba(232, 183, 106, .10);
  --solid: #f3ede2;
  --solid-ink: #12100d;
  --solid-hover: #fff8ea;
  --danger-hover: #ff9688;
  --bar-bg: rgba(11, 10, 8, .74);
  --row-hover: rgba(243, 237, 226, .035);
  --log-bg: #080706;
  --scrim: rgba(4, 3, 2, .62);
  --shadow: 0 28px 80px rgba(0, 0, 0, .46);
  --topbar-h: 60px;
}

@media (prefers-color-scheme: light) {
  :root {
    --bg: #f2eee5;
    --surface: #fbf8f1;
    --surface-2: #f5f0e5;
    --surface-3: #ebe5d8;
    --ink: #1a1713;
    --ink-2: #5a544b;
    --ink-3: #746b5f;
    --line: rgba(26, 23, 19, .15);
    --line-soft: rgba(26, 23, 19, .085);
    --line-strong: rgba(26, 23, 19, .28);
    --running: #177a45;
    --running-soft: rgba(23, 122, 69, .09);
    --danger: #b93b30;
    --danger-ink: #fffaf2;
    --danger-soft: rgba(185, 59, 48, .08);
    --amber: #8f5b0f;
    --amber-soft: rgba(143, 91, 15, .08);
    --solid: #1a1713;
    --solid-ink: #fbf8f1;
    --solid-hover: #2b2721;
    --danger-hover: #a93228;
    --bar-bg: rgba(242, 238, 229, .82);
    --row-hover: rgba(26, 23, 19, .035);
    --log-bg: #f6f2e9;
    --scrim: rgba(30, 25, 18, .30);
    --shadow: 0 28px 80px rgba(31, 25, 16, .14);
  }
}

* { box-sizing: border-box; }

html {
  scroll-padding-top: calc(var(--topbar-h) + 40px);
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;
  min-height: 100vh;
  background:
    radial-gradient(900px 520px at 12% -8%, rgba(243, 237, 226, .045), transparent 70%),
    var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 14px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

@media (prefers-color-scheme: light) {
  body {
    background:
      radial-gradient(900px 520px at 12% -8%, rgba(255, 255, 255, .62), transparent 70%),
      var(--bg);
  }
}

body.console-open { overflow: hidden; }

::selection { background: var(--ink); color: var(--bg); }

button, input, kbd { font: inherit; }
button { -webkit-tap-highlight-color: transparent; }

:focus-visible {
  outline: 2px solid var(--ink);
  outline-offset: 2px;
}

/* ——— top bar ——— */

.topbar {
  position: sticky;
  top: 0;
  z-index: 30;
  height: var(--topbar-h);
  background: var(--bar-bg);
  border-bottom: 1px solid var(--line-soft);
  -webkit-backdrop-filter: saturate(150%) blur(18px);
  backdrop-filter: saturate(150%) blur(18px);
}

.topbar-inner {
  max-width: 1280px;
  height: 100%;
  margin: 0 auto;
  padding: 0 32px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
}

.mark {
  width: 30px;
  height: 30px;
  flex: none;
  display: grid;
  place-items: center;
  border: 1px solid var(--line-strong);
  border-radius: 50%;
  color: var(--ink);
}

.brand-name {
  font-size: 15px;
  font-weight: 600;
  letter-spacing: -.01em;
  white-space: nowrap;
}

.host {
  margin-left: 2px;
  padding-left: 12px;
  border-left: 1px solid var(--line);
  color: var(--ink-3);
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: .02em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.bulk { display: flex; align-items: center; gap: 8px; flex: none; }

/* ——— buttons ——— */

.btn {
  height: 31px;
  padding: 0 13px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: transparent;
  color: var(--ink-2);
  font-size: 12px;
  font-weight: 500;
  white-space: nowrap;
  cursor: pointer;
  transition: background-color .15s var(--ease-out), border-color .15s var(--ease-out), color .15s var(--ease-out), transform .12s var(--ease-out);
}

.btn:active { transform: scale(.97); }
.btn:disabled { cursor: default; opacity: .4; }

.btn-solid {
  background: var(--solid);
  border-color: var(--solid);
  color: var(--solid-ink);
  font-weight: 600;
}

.btn-ghost-danger { color: var(--danger); border-color: var(--line); }

.btn-danger-solid {
  background: var(--danger);
  border-color: var(--danger);
  color: var(--danger-ink);
  font-weight: 600;
}

/* ——— page ——— */

.page {
  max-width: 1280px;
  margin: 0 auto;
  padding: 26px 32px 64px;
}

/* ——— hero readout ——— */

.hero {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(330px, 560px);
  gap: 44px;
  align-items: end;
  padding: 6px 0 30px;
}

.kicker, .mini-label {
  margin: 0;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  color: var(--ink-3);
  font-size: 10px;
  font-weight: 500;
  line-height: 1.2;
  letter-spacing: .13em;
  text-transform: uppercase;
}

.kicker::before {
  content: "";
  width: 16px;
  height: 1px;
  flex: none;
  background: var(--line-strong);
}

.kicker .mono { letter-spacing: .04em; color: var(--ink-3); }

.counts {
  display: flex;
  align-items: flex-end;
  gap: 34px;
  margin-top: 15px;
}

.count {
  display: flex;
  flex-direction: column;
  gap: 1px;
  min-width: 0;
}

.count + .count {
  padding-left: 34px;
  border-left: 1px solid var(--line-soft);
}

.count-label {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  color: var(--ink-3);
  font-size: 10.5px;
  letter-spacing: .02em;
  white-space: nowrap;
}

.count strong {
  color: var(--ink);
  font-family: var(--mono);
  font-size: clamp(36px, 4vw, 50px);
  font-weight: 500;
  line-height: 1;
  letter-spacing: -.055em;
  font-variant-numeric: tabular-nums;
}

.count:nth-child(2) strong { color: var(--ink-2); }
.count:nth-child(2) { min-width: 52px; }

/* ——— status map ——— */

.hero-map { min-width: 0; }

.map-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 11px;
}

.sync { color: var(--ink-3); font-family: var(--mono); font-size: 10px; letter-spacing: .04em; }

.segments {
  display: flex;
  align-items: flex-end;
  gap: 3px;
  height: 25px;
}

.segment {
  flex: 1 1 0;
  min-width: 0;
  height: 100%;
  border: 1px solid transparent;
  border-radius: 2px;
  background: var(--surface-3);
  transition: background-color .2s var(--ease-out), border-color .2s var(--ease-out);
}

.segment.running { background: var(--running); border-color: var(--running); }
.segment.starting { height: 62%; background: var(--amber); border-color: var(--amber); }
.segment.stopped { height: 26%; background: var(--line); border-color: transparent; }

.legend {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-top: 9px;
  color: var(--ink-3);
  font-size: 10px;
}

.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend .legend-note { margin-left: auto; font-family: var(--mono); letter-spacing: .02em; }

/* ——— dots ——— */

.dot {
  width: 6px;
  height: 6px;
  flex: none;
  display: inline-block;
  border-radius: 50%;
  background: var(--ink-3);
}

.dot.running {
  background: var(--running);
  box-shadow: 0 0 0 3px var(--running-soft);
}

.dot.muted {
  background: transparent;
  border: 1px solid var(--ink-3);
}

.dot.starting { background: var(--amber); box-shadow: 0 0 0 3px var(--amber-soft); }

/* ——— toolbar ——— */

.toolbar {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px 12px;
  padding: 0 0 14px;
}

.search {
  position: relative;
  width: 300px;
  max-width: 100%;
  height: 34px;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 10px;
  border: 1px solid var(--line);
  border-radius: 7px;
  background: var(--surface);
  transition: border-color .15s var(--ease-out);
}

.search:focus-within {
  border-color: var(--line-strong);
  box-shadow: 0 0 0 1px var(--line-strong);
}

.search svg { flex: none; color: var(--ink-3); }

.search input {
  width: 100%;
  min-width: 0;
  height: 100%;
  padding: 0;
  border: 0;
  outline: 0;
  background: transparent;
  color: var(--ink);
  font-size: 12.5px;
}

.search input::placeholder { color: var(--ink-3); }

.search kbd {
  flex: none;
  min-width: 17px;
  height: 17px;
  display: inline-grid;
  place-items: center;
  border: 1px solid var(--line);
  border-radius: 4px;
  color: var(--ink-3);
  font-family: var(--mono);
  font-size: 9px;
  line-height: 1;
}

.filter {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  padding: 3px;
  border: 1px solid var(--line);
  border-radius: 7px;
  background: var(--surface);
}

.seg {
  height: 26px;
  padding: 0 9px;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  border: 0;
  border-radius: 4px;
  background: transparent;
  color: var(--ink-2);
  font-size: 11.5px;
  white-space: nowrap;
  cursor: pointer;
  transition: background-color .14s var(--ease-out), color .14s var(--ease-out);
}

.seg.is-on { background: var(--ink); color: var(--bg); }

.seg .mono {
  color: var(--ink-3);
  font-size: 9.5px;
  font-variant-numeric: tabular-nums;
}
.seg.is-on .mono { color: var(--bg); opacity: .62; }

.sys-toggle {
  height: 30px;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 0 2px;
  color: var(--ink-3);
  font-size: 11px;
  white-space: nowrap;
  cursor: pointer;
  user-select: none;
}

.sys-toggle input {
  position: absolute;
  opacity: 0;
  pointer-events: none;
}

.box {
  width: 14px;
  height: 14px;
  flex: none;
  display: grid;
  place-items: center;
  border: 1px solid var(--line-strong);
  border-radius: 3px;
  color: transparent;
  transition: background-color .15s var(--ease-out), color .15s var(--ease-out), border-color .15s var(--ease-out);
}

.sys-toggle input:checked + .box { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.sys-toggle input:focus-visible + .box { outline: 2px solid var(--ink); outline-offset: 2px; }

.sync-badge {
  margin-left: auto;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  color: var(--ink-3);
  font-size: 10px;
  letter-spacing: .04em;
  white-space: nowrap;
}

.sync-badge .mono { font-size: 9.5px; }

/* ——— ledger ——— */

.ledger {
  --cols: 92px minmax(0, 1fr) 150px 384px;
  --colgap: 18px;
  border: 1px solid var(--line);
  border-radius: 16px;
  background: var(--surface);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .025);
}

.ledger-top {
  min-height: 44px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 10px 18px 9px;
}

.ledger-count {
  color: var(--ink-3);
  font-family: var(--mono);
  font-size: 9.5px;
  letter-spacing: .03em;
  font-variant-numeric: tabular-nums;
}
.ledger-count b { color: var(--ink-2); font-weight: 500; }

.ledger-head {
  position: sticky;
  top: var(--topbar-h);
  z-index: 8;
  display: grid;
  grid-template-columns: var(--cols);
  column-gap: var(--colgap);
  align-items: center;
  padding: 8px 18px;
  border-top: 1px solid var(--line-soft);
  border-bottom: 1px solid var(--line);
  background: var(--bar-bg);
  -webkit-backdrop-filter: saturate(150%) blur(16px);
  backdrop-filter: saturate(150%) blur(16px);
  color: var(--ink-3);
  font-size: 9px;
  letter-spacing: .12em;
  text-transform: uppercase;
}

.ledger-head span:last-child { text-align: right; padding-right: 2px; }

.list { min-height: 96px; }

/* ——— rows ——— */

.row {
  display: grid;
  grid-template-columns: var(--cols);
  column-gap: var(--colgap);
  align-items: center;
  min-height: 88px;
  padding: 13px 18px;
  transition: background-color .15s var(--ease-out);
}

.row + .row { border-top: 1px solid var(--line-soft); }
.row:last-child { border-radius: 0 0 15px 15px; }

@media (hover: hover) and (pointer: fine) {
  .row:hover { background: var(--row-hover); }
}

.port-cell {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}

.port-num {
  color: var(--ink);
  font-family: var(--mono);
  font-size: 21px;
  font-weight: 500;
  line-height: 1.15;
  letter-spacing: -.035em;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.protocol {
  color: var(--ink-3);
  font-family: var(--mono);
  font-size: 8.5px;
  line-height: 1.2;
  letter-spacing: .13em;
  text-transform: uppercase;
}

.service-cell { min-width: 0; }

.service-name {
  margin: 0;
  color: var(--ink);
  font-size: 15px;
  font-weight: 600;
  line-height: 1.25;
  letter-spacing: -.012em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.command {
  display: block;
  margin-top: 3px;
  color: var(--ink-3);
  font-family: var(--mono);
  font-size: 10.8px;
  line-height: 1.4;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.cwd {
  display: flex;
  align-items: center;
  gap: 5px;
  margin-top: 3px;
  color: var(--ink-3);
  font-family: var(--mono);
  font-size: 10px;
  line-height: 1.35;
  white-space: nowrap;
  overflow: hidden;
}

.cwd svg { flex: none; opacity: .8; }
.cwd span { min-width: 0; overflow: hidden; text-overflow: ellipsis; }

.note {
  margin-top: 4px;
  color: var(--amber);
  font-size: 10.5px;
  line-height: 1.35;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.state-cell { min-width: 0; }

.state-line {
  display: flex;
  align-items: center;
  gap: 7px;
  min-width: 0;
}

.state-label {
  font-size: 11.5px;
  font-weight: 500;
  white-space: nowrap;
}
.state-label.running { color: var(--running); }
.state-label.starting { color: var(--amber); }
.state-label.stopped { color: var(--ink-3); }

.uptime {
  display: block;
  margin-top: 3px;
  color: var(--ink-3);
  font-family: var(--mono);
  font-size: 9.5px;
  line-height: 1.4;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  font-variant-numeric: tabular-nums;
}

.actions {
  display: grid;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  gap: 4px;
  width: 100%;
}

.act {
  height: 30px;
  min-width: 0;
  padding: 0 3px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  border: 1px solid var(--line);
  border-radius: 5px;
  background: transparent;
  color: var(--ink-2);
  font-size: 11px;
  font-weight: 500;
  line-height: 1;
  white-space: nowrap;
  cursor: pointer;
  transition: background-color .14s var(--ease-out), border-color .14s var(--ease-out), color .14s var(--ease-out), transform .11s var(--ease-out);
}

.act svg { flex: none; width: 11px; height: 11px; }

.act:active { transform: scale(.97); }

.act.start {
  background: var(--solid);
  border-color: var(--solid);
  color: var(--solid-ink);
  font-weight: 600;
}

.act.stop { color: var(--danger); }

.act:disabled {
  cursor: default;
  opacity: .34;
  background: transparent;
  border-color: var(--line-soft);
  color: var(--ink-3);
}
.act:disabled:active { transform: none; }


@media (hover: hover) and (pointer: fine) {
  .btn:hover { background: var(--surface-2); color: var(--ink); }
  .btn:disabled:hover { background: transparent; color: var(--ink-2); }
  .btn-solid:hover { background: var(--solid-hover); border-color: var(--solid-hover); color: var(--solid-ink); }
  .btn-ghost-danger:hover { background: var(--danger-soft); color: var(--danger); border-color: var(--danger); }
  .btn-danger-solid:hover { background: var(--danger-hover); border-color: var(--danger-hover); color: var(--danger-ink); }
  .seg:hover { color: var(--ink); background: var(--row-hover); }
  .seg.is-on:hover { background: var(--ink); color: var(--bg); }
  .sys-toggle:hover { color: var(--ink-2); }
  .act:hover { background: var(--surface-2); border-color: var(--line-strong); color: var(--ink); }
  .act.start:hover { background: var(--solid-hover); border-color: var(--solid-hover); color: var(--solid-ink); }
  .act.stop:hover { background: var(--danger-soft); border-color: var(--danger); color: var(--danger); }
  .act:disabled:hover { background: transparent; border-color: var(--line-soft); color: var(--ink-3); }
  .icon-btn:hover { background: var(--surface-2); color: var(--ink); }
}

/* ——— row entrance: one group, only for newly seen rows ——— */

.row.enter {
  transition:
    opacity .24s var(--ease-out) var(--delay, 0ms),
    transform .24s var(--ease-out) var(--delay, 0ms),
    background-color .15s var(--ease-out);
}

@starting-style {
  .row.enter {
    opacity: 0;
    transform: translateY(5px);
  }
}

/* ——— empty ——— */

.empty {
  min-height: 300px;
  padding: 60px 24px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  text-align: center;
}

.empty-icon {
  width: 42px;
  height: 42px;
  display: grid;
  place-items: center;
  margin-bottom: 4px;
  border: 1px solid var(--line);
  border-radius: 50%;
  color: var(--ink-3);
}

.empty h3 {
  margin: 0;
  color: var(--ink-2);
  font-size: 13.5px;
  font-weight: 600;
  letter-spacing: -.01em;
}

.empty p {
  margin: 0;
  max-width: 320px;
  color: var(--ink-3);
  font-size: 11.5px;
  line-height: 1.6;
}

/* ——— bottom console ——— */

.scrim {
  position: fixed;
  inset: 0;
  z-index: 40;
  background: var(--scrim);
  opacity: 0;
  pointer-events: none;
  transition: opacity .18s var(--ease-out);
  -webkit-backdrop-filter: blur(2px);
  backdrop-filter: blur(2px);
}

.scrim.on { opacity: 1; pointer-events: auto; }

.console {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 50;
  height: min(620px, 68vh);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  border-top: 1px solid var(--line-strong);
  border-radius: 18px 18px 0 0;
  background: var(--surface);
  box-shadow: var(--shadow);
  transform: translateY(calc(100% + 26px));
  visibility: hidden;
  transition: transform .22s var(--ease-out), visibility 0s linear .22s;
}

.console.on {
  transform: translateY(0);
  visibility: visible;
  transition: transform .32s var(--ease-drawer), visibility 0s;
}

.console:focus { outline: none; }

.console-grab {
  flex: none;
  height: 22px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: grab;
  touch-action: none;
}

.console-grab::before {
  content: "";
  width: 38px;
  height: 4px;
  border-radius: 99px;
  background: var(--ink-3);
  opacity: .48;
}

.console-grab:active { cursor: grabbing; }

.console-page {
  flex: 1;
  min-height: 0;
  width: 100%;
  max-width: 1280px;
  margin: 0 auto;
  padding: 0 32px 18px;
  display: flex;
  flex-direction: column;
}

.console-head {
  flex: none;
  display: flex;
  align-items: flex-end;
  gap: 12px;
  padding: 2px 0 12px;
  border-bottom: 1px solid var(--line-soft);
}

.console-title { min-width: 0; }

.console-title h2 {
  margin: 3px 0 0;
  color: var(--ink);
  font-size: 18px;
  font-weight: 600;
  line-height: 1.2;
  letter-spacing: -.02em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.console-port {
  margin-left: auto;
  color: var(--ink-2);
  font-family: var(--mono);
  font-size: 12px;
  letter-spacing: -.01em;
  white-space: nowrap;
}

.icon-btn {
  width: 30px;
  height: 30px;
  flex: none;
  display: grid;
  place-items: center;
  border: 1px solid var(--line);
  border-radius: 50%;
  background: transparent;
  color: var(--ink-2);
  cursor: pointer;
  transition: background-color .14s var(--ease-out), color .14s var(--ease-out), transform .11s var(--ease-out);
}

.icon-btn:active { transform: scale(.97); }

.console-body {
  flex: 1;
  min-height: 0;
  display: flex;
  padding: 12px 0 10px;
}

.console-log {
  flex: 1;
  min-height: 0;
  margin: 0;
  padding: 14px 16px;
  overflow: auto;
  border: 1px solid var(--line-soft);
  border-radius: 9px;
  background: var(--log-bg);
  color: var(--ink-2);
  font-family: var(--mono);
  font-size: 11px;
  line-height: 1.72;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  scrollbar-color: var(--line-strong) transparent;
}

.console-foot {
  flex: none;
  display: flex;
  align-items: center;
  gap: 7px;
  color: var(--ink-3);
  font-size: 9.5px;
  letter-spacing: .04em;
}

/* ——— toast ——— */

.toast {
  position: fixed;
  top: calc(var(--topbar-h) + 14px);
  left: 50%;
  z-index: 90;
  max-width: min(440px, calc(100vw - 32px));
  padding: 10px 14px;
  display: flex;
  align-items: center;
  gap: 9px;
  border: 1px solid var(--line-strong);
  border-radius: 8px;
  background: var(--surface);
  color: var(--ink);
  font-size: 11.5px;
  line-height: 1.4;
  box-shadow: 0 14px 40px rgba(0, 0, 0, .22);
  opacity: 0;
  pointer-events: none;
  transform: translate(-50%, -8px) scale(.98);
  transition: opacity .18s var(--ease-out), transform .2s var(--ease-out);
}

.toast.on { opacity: 1; transform: translate(-50%, 0) scale(1); }
.toast.error { border-color: var(--danger); color: var(--danger); }

/* ——— confirm ——— */

.confirm {
  width: min(380px, calc(100vw - 36px));
  margin: auto;
  padding: 0;
  border: 1px solid var(--line-strong);
  border-radius: 14px;
  background: var(--surface);
  color: var(--ink);
  box-shadow: var(--shadow);
  opacity: 0;
  transform: scale(.96);
  transition: opacity .18s var(--ease-out), transform .22s var(--ease-out);
}

.confirm[open] { opacity: 1; transform: scale(1); }

@starting-style {
  .confirm[open] { opacity: 0; transform: scale(.96); }
}

.confirm::backdrop {
  background: var(--scrim);
  -webkit-backdrop-filter: blur(2px);
  backdrop-filter: blur(2px);
}

.confirm form { padding: 18px; }

.confirm-copy .kicker { margin-bottom: 9px; }

.confirm h2 {
  margin: 0;
  font-size: 16px;
  font-weight: 600;
  line-height: 1.3;
  letter-spacing: -.02em;
}

.confirm p {
  margin: 7px 0 0;
  color: var(--ink-2);
  font-size: 12px;
  line-height: 1.6;
}

.confirm-actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 18px;
}

/* ——— responsive ——— */

@media (max-width: 1180px) {
  .ledger {
    --cols: 84px minmax(0, 1fr) 142px 336px;
    --colgap: 14px;
  }
  .hero { gap: 30px; }
  .counts { gap: 26px; }
  .count + .count { padding-left: 26px; }
}

@media (max-width: 980px) {
  .ledger-head { display: none; }
  .ledger {
    --cols: 84px minmax(0, 1fr) 146px;
    --colgap: 14px;
  }
  .row {
    grid-template-areas:
      "port service state"
      "actions actions actions";
    row-gap: 11px;
    min-height: 0;
    padding: 14px 18px 13px;
  }
  .port-cell { grid-area: port; }
  .service-cell { grid-area: service; }
  .state-cell { grid-area: state; }
  .actions { grid-area: actions; }
  .hero {
    grid-template-columns: minmax(0, 1fr);
    gap: 22px;
    align-items: start;
  }
  .hero-map { max-width: none; }
  .toolbar { gap: 9px 10px; }
}

@media (max-width: 760px) {
  .topbar-inner { padding: 0 18px; }
  .page { padding: 22px 18px 52px; }
  .host { display: none; }
  .hero { padding-bottom: 24px; }
  .counts { gap: 22px; }
  .count + .count { padding-left: 22px; }
  .count strong { font-size: clamp(34px, 10vw, 42px); }
  .search { width: 100%; }
  .sync-badge { margin-left: 0; }
  .ledger { border-radius: 13px; }
  .row { border-radius: 0 !important; }
  .console-page { padding: 0 18px 14px; }
  .console { height: min(640px, 72vh); }
}

@media (max-width: 660px) {
  .ledger {
    --cols: 70px minmax(0, 1fr);
    --colgap: 12px;
  }
  .row {
    grid-template-areas:
      "port service"
      "state state"
      "actions actions";
    row-gap: 10px;
    padding: 13px 14px 12px;
  }
  .actions { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .ledger-top { padding-left: 14px; padding-right: 14px; }
  .protocol { font-size: 8px; }
  .bulk { gap: 6px; }
  .btn { padding: 0 10px; font-size: 11.5px; }
  .brand-name { font-size: 14px; }
  .mark { width: 27px; height: 27px; }
  .toolbar { align-items: stretch; }
  .filter { width: 100%; justify-content: space-between; }
  .seg { flex: 1; justify-content: center; }
  .sys-toggle { height: 28px; }
}

@media (max-width: 560px) {
  .segments { gap: 2px; }
  .legend { gap: 12px; }
  .legend .legend-note { display: none; }
  .console-head { align-items: center; }
  .console-port { display: none; }
  .counts { gap: 18px; }
  .count + .count { padding-left: 18px; }
  .count-label { font-size: 10px; }
}

@media (prefers-reduced-motion: reduce) {
  .row.enter { transition: opacity .18s linear var(--delay, 0ms); }
  @starting-style {
    .row.enter { transform: none; }
  }
  .btn:active, .act:active, .icon-btn:active { transform: none; }
  .console {
    opacity: 0;
    transform: none;
    transition: opacity .16s linear, visibility 0s linear .16s;
  }
  .console.on {
    opacity: 1;
    transform: none;
    transition: opacity .16s linear, visibility 0s;
  }
  .toast { transform: translate(-50%, 0); }
  .confirm { transform: none; }
}

@media (prefers-reduced-transparency: reduce) {
  .topbar, .ledger-head { background: var(--bg); -webkit-backdrop-filter: none; backdrop-filter: none; }
  .scrim { -webkit-backdrop-filter: none; backdrop-filter: none; }
  .confirm::backdrop { -webkit-backdrop-filter: none; backdrop-filter: none; }
}

@media (prefers-contrast: more) {
  :root {
    --line: rgba(243, 237, 226, .24);
    --line-soft: rgba(243, 237, 226, .16);
    --line-strong: rgba(243, 237, 226, .44);
  }
}
@media (prefers-color-scheme: light) and (prefers-contrast: more) {
  :root {
    --line: rgba(26, 23, 19, .3);
    --line-soft: rgba(26, 23, 19, .18);
    --line-strong: rgba(26, 23, 19, .48);
  }
}

</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <span class="mark" aria-hidden="true">
        <svg width="17" height="17" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round">
          <circle cx="9" cy="9" r="5.4"/>
          <path d="M9 1.5v2.1M9 14.4v2.1M1.5 9h2.1M14.4 9h2.1"/>
          <circle cx="9" cy="9" r="1.15" fill="currentColor" stroke="none"/>
        </svg>
      </span>
      <span class="brand-name">端口控制台</span>
      <span class="host" id="hostLabel">正在连接</span>
    </div>
    <div class="bulk">
      <button class="btn btn-ghost-danger" id="btnStopAll" type="button" disabled>全部停止</button>
      <button class="btn btn-solid" id="btnStartAll" type="button" disabled>全部启动</button>
    </div>
  </div>
</header>

<main class="page">

  <section class="hero" aria-label="端口概览">
    <div class="hero-left">
      <div class="kicker">本机端口 <span class="mono">LOCAL</span></div>
      <div class="counts">
        <div class="count">
          <span class="count-label"><i class="dot running"></i>运行中</span>
          <strong class="mono" data-count="running">—</strong>
        </div>
        <div class="count">
          <span class="count-label"><i class="dot muted"></i>已停止</span>
          <strong class="mono" data-count="stopped">—</strong>
        </div>
        <div class="count">
          <span class="count-label">全部端口</span>
          <strong class="mono" data-count="total">—</strong>
        </div>
      </div>
    </div>
    <div class="hero-map">
      <div class="map-head">
        <span class="mini-label">端口状态</span>
        <span class="sync" data-sync>—</span>
      </div>
      <div class="segments" id="segments" aria-hidden="true"></div>
      <div class="legend">
        <span><i class="dot running"></i>运行</span>
        <span><i class="dot muted"></i>停止</span>
        <span class="legend-note">按端口排序</span>
      </div>
    </div>
  </section>

  <section class="toolbar" aria-label="筛选与搜索">
    <label class="search" for="searchInput">
      <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true">
        <circle cx="7" cy="7" r="4.6"/><path d="M10.4 10.4 14 14"/>
      </svg>
      <input id="searchInput" type="search" placeholder="搜索端口、服务或命令" autocomplete="off" spellcheck="false">
      <kbd>/</kbd>
    </label>
    <div class="filter" role="group" aria-label="状态筛选">
      <button class="seg is-on" type="button" data-filter="all" aria-pressed="true">全部 <span class="mono" data-count="total">—</span></button>
      <button class="seg" type="button" data-filter="running" aria-pressed="false">运行 <span class="mono" data-count="running">—</span></button>
      <button class="seg" type="button" data-filter="stopped" aria-pressed="false">停止 <span class="mono" data-count="stopped">—</span></button>
    </div>
    <label class="sys-toggle">
      <input id="hideSys" type="checkbox">
      <span class="box" aria-hidden="true">
        <svg width="9" height="9" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 5.2 4.1 7.3 8 2.8"/>
        </svg>
      </span>
      <span>隐藏 1024 以下</span>
    </label>
    <span class="sync-badge"><i class="dot running live"></i>自动刷新 <span class="mono">4s</span></span>
  </section>

  <section class="ledger" aria-label="端口清单">
    <div class="ledger-top">
      <span class="mini-label">端口清单</span>
      <span class="ledger-count">显示 <b data-visible>—</b> / <b data-count="total">—</b></span>
    </div>
    <div class="ledger-head" aria-hidden="true">
      <span>端口</span>
      <span>服务 / 命令</span>
      <span>状态</span>
      <span>操作</span>
    </div>
    <div class="list" id="list">
      <div class="empty">
        <span class="empty-icon" aria-hidden="true">
          <svg width="19" height="19" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round">
            <circle cx="9" cy="9" r="5.4"/><path d="M9 1.5v2.1M9 14.4v2.1M1.5 9h2.1M14.4 9h2.1"/>
            <circle cx="9" cy="9" r="1.15" fill="currentColor" stroke="none"/>
          </svg>
        </span>
        <h3>正在读取本机端口</h3>
        <p>扫描当前正在监听的端口，稍等片刻。</p>
      </div>
    </div>
  </section>

</main>

<div class="scrim" id="scrim"></div>

<section class="console" id="console" role="dialog" aria-modal="true" aria-labelledby="consoleTitle" tabindex="-1">
  <div class="console-grab" id="consoleGrab" aria-hidden="true"></div>
  <div class="console-page">
    <header class="console-head">
      <div class="console-title">
        <span class="mini-label">日志流</span>
        <h2 id="consoleTitle">日志</h2>
      </div>
      <span class="console-port" id="consolePort">—</span>
      <button class="icon-btn" id="consoleClose" type="button" aria-label="关闭日志">
        <svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
          <path d="M2.5 2.5 9.5 9.5M9.5 2.5 2.5 9.5"/>
        </svg>
      </button>
    </header>
    <div class="console-body">
      <pre class="console-log" id="logBody" tabindex="0">—</pre>
    </div>
    <footer class="console-foot"><i class="dot running"></i>实时跟随 · 最近 400 行</footer>
  </div>
</section>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<dialog class="confirm" id="confirm" aria-labelledby="confirmTitle" aria-describedby="confirmBody">
  <form method="dialog">
    <div class="confirm-copy">
      <span class="kicker">确认操作</span>
      <h2 id="confirmTitle">确认</h2>
      <p id="confirmBody"></p>
    </div>
    <div class="confirm-actions">
      <button class="btn" type="submit" value="cancel">取消</button>
      <button class="btn btn-danger-solid" type="submit" value="ok">确认</button>
    </div>
  </form>
</dialog>

<script>
(() => {
  'use strict';

  const listEl = document.getElementById('list');
  const segmentsEl = document.getElementById('segments');
  const searchEl = document.getElementById('searchInput');
  const hideSysEl = document.getElementById('hideSys');
  const hostEl = document.getElementById('hostLabel');
  const startAllBtn = document.getElementById('btnStartAll');
  const stopAllBtn = document.getElementById('btnStopAll');
  const toastEl = document.getElementById('toast');
  const scrimEl = document.getElementById('scrim');
  const consoleEl = document.getElementById('console');
  const consoleGrab = document.getElementById('consoleGrab');
  const consoleClose = document.getElementById('consoleClose');
  const consoleTitle = document.getElementById('consoleTitle');
  const consolePort = document.getElementById('consolePort');
  const logBody = document.getElementById('logBody');
  const confirmEl = document.getElementById('confirm');
  const confirmTitle = document.getElementById('confirmTitle');
  const confirmBody = document.getElementById('confirmBody');
  const topbarEl = document.querySelector('.topbar');
  const pageEl = document.querySelector('.page');

  let items = [];
  let itemByKey = new Map();
  let rowByKey = new Map();
  let filter = 'all';
  let keyword = '';
  let busy = false;
  let loaded = false;
  let firstRender = true;
  let refreshTimer = null;
  let searchTimer = null;
  let toastTimer = null;
  let lastError = '';
  let logTimer = null;
  let activeLogKey = null;
  let logTrigger = null;
  let confirmResolve = null;
  let drag = null;
  let deepLinkChecked = false;

  const statusText = { running: '运行中', stopped: '已停止', starting: '启动中' };
  const actionText = { start: '已启动', stop: '已停止', restart: '已重启', kill: '已清理进程' };

  const esc = (value) => String(value == null ? '' : value)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');

  const folderIcon = `<svg viewBox="0 0 14 14" width="11" height="11" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1.8 3.2h3.1l1.1 1.2h6.2v6.1H1.8z"/></svg>`;

  function updateText(selector, value) {
    document.querySelectorAll(selector).forEach((el) => { el.textContent = value; });
  }

  function updateCounts() {
    const running = items.filter((i) => i.status === 'running').length;
    const stopped = items.filter((i) => i.status === 'stopped').length;
    updateText('[data-count="running"]', running);
    updateText('[data-count="stopped"]', stopped);
    updateText('[data-count="total"]', items.length);
    startAllBtn.disabled = busy || !loaded || !items.some((i) => i.managed && i.status === 'stopped');
    stopAllBtn.disabled = busy || !loaded || !items.some((i) => i.managed && i.status === 'running');
  }

  function visibleItems() {
    return items.filter((item) => {
      if (filter !== 'all' && item.status !== filter) return false;
      if (hideSysEl.checked && Number(item.port) < 1024) return false;
      if (!keyword) return true;
      return item.haystack.includes(keyword);
    });
  }

  function updateVisibleCount() {
    updateText('[data-visible]', visibleItems().length);
  }

  function renderSegments() {
    const frag = document.createDocumentFragment();
    items.forEach((item) => {
      const seg = document.createElement('span');
      seg.className = `segment ${item.status}`;
      seg.title = `:${item.port} ${statusText[item.status] || item.status}`;
      frag.appendChild(seg);
    });
    segmentsEl.replaceChildren(frag);
  }

  function actionButtons(item) {
    const b = (act, label, cls = '', disabled = false) =>
      `<button class="act ${cls}" type="button" data-act="${act}" ${disabled ? 'disabled' : ''} aria-label="${label}">${label}</button>`;
    const isRunning = item.status === 'running';
    const isStarting = item.status === 'starting';
    const isStopped = item.status === 'stopped';
    const revealBtn = `<button class="act" type="button" data-act="reveal" ${busy || !item.cwd ? 'disabled' : ''} aria-label="在访达中打开项目目录">${folderIcon}访达</button>`;

    if (!item.managed) {
      return [
        b('start', '启动', 'start', true),
        b('stop', '停止', 'stop', busy),
        b('restart', '重启', '', true),
        b('open', '打开', '', true),
        b('logs', '日志', '', true),
        revealBtn,
      ].join('');
    }

    return [
      b('start', '启动', 'start', busy || isRunning || isStarting),
      b('stop', '停止', 'stop', busy || (!isRunning && !isStarting)),
      b('restart', '重启', '', busy || isStopped || isStarting),
      b('open', '打开', '', busy || !item.url || !isRunning),
      b('logs', '日志', '', busy),
      revealBtn,
    ].join('');
  }

  function buildRow(item) {
    const el = document.createElement('article');
    el.className = 'row enter';
    el.dataset.key = item.key;
    el.innerHTML = `
      <div class="port-cell">
        <span class="port-num">:${esc(item.port)}</span>
        <span class="protocol">TCP</span>
      </div>
      <div class="service-cell">
        <h3 class="service-name"></h3>
        <code class="command"></code>
        <div class="cwd">${folderIcon}<span></span></div>
        <div class="note" hidden></div>
      </div>
      <div class="state-cell">
        <div class="state-line"><i class="dot"></i><span class="state-label"></span></div>
        <span class="uptime"></span>
      </div>
      <div class="actions"></div>
    `;

    el._refs = {
      nameEl: el.querySelector('.service-name'),
      commandEl: el.querySelector('.command'),
      cwdEl: el.querySelector('.cwd'),
      noteEl: el.querySelector('.note'),
      stateDot: el.querySelector('.dot'),
      stateLabel: el.querySelector('.state-label'),
      uptimeEl: el.querySelector('.uptime'),
      actionsEl: el.querySelector('.actions'),
    };
    return el;
  }

  function updateRow(el, item) {
    const r = el._refs;
    el.dataset.key = item.key;
    el.dataset.status = item.status;
    el.setAttribute('aria-label', `${item.name}，端口 ${item.port}，${statusText[item.status] || item.status}`);
    r.nameEl.textContent = item.name;
    r.nameEl.title = item.name;
    r.commandEl.textContent = item.command || '—';
    r.commandEl.title = item.command || '';
    r.cwdEl.querySelector('span').textContent = item.cwd || '未识别项目目录';
    r.cwdEl.title = item.cwd || '未识别项目目录';
    r.noteEl.textContent = item.note || '';
    r.noteEl.hidden = !item.note;
    r.stateDot.className = `dot ${item.status === 'running' ? 'running' : item.status === 'starting' ? 'starting' : 'muted'}`;
    r.stateLabel.className = `state-label ${item.status}`;
    r.stateLabel.textContent = statusText[item.status] || item.status;
    r.uptimeEl.textContent = item.meta || '';
    r.uptimeEl.title = item.meta || '';
    const buttons = actionButtons(item);
    if (r.actionsEl._html !== buttons) {
      const focused = r.actionsEl.contains(document.activeElement) ? document.activeElement.getAttribute('data-act') : null;
      r.actionsEl.innerHTML = buttons;
      r.actionsEl._html = buttons;
      if (focused) {
        const next = r.actionsEl.querySelector(`[data-act="${focused}"]`);
        if (next && !next.disabled) next.focus({ preventScroll: true });
      }
    }
  }

  function emptyState(title, body) {
    const div = document.createElement('div');
    div.className = 'empty';
    div.innerHTML = `
      <span class="empty-icon" aria-hidden="true">
        <svg width="19" height="19" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round">
          <circle cx="9" cy="9" r="5.4"/><path d="M9 1.5v2.1M9 14.4v2.1M1.5 9h2.1M14.4 9h2.1"/>
          <circle cx="9" cy="9" r="1.15" fill="currentColor" stroke="none"/>
        </svg>
      </span>
      <h3>${esc(title)}</h3>
      <p>${esc(body)}</p>
    `;
    return div;
  }

  function scheduleEntrance() {
    const rows = [...listEl.querySelectorAll('.row.enter')];
    if (firstRender) {
      const delays = [0, 34, 62, 86, 106, 124, 140, 154];
      rows.forEach((row, index) => {
        if (index < delays.length) {
          row.style.setProperty('--delay', `${delays[index]}ms`);
        } else {
          row.classList.remove('enter');
          row.style.removeProperty('--delay');
        }
      });
      firstRender = false;
    }
    rows.forEach((row) => {
      if (!row.classList.contains('enter') || row._enterScheduled) return;
      row._enterScheduled = true;
      const delay = parseInt(row.style.getPropertyValue('--delay'), 10) || 0;
      window.setTimeout(() => {
        row.classList.remove('enter');
        row.style.removeProperty('--delay');
      }, 360 + delay);
    });
  }

  function renderList() {
    const visible = visibleItems();
    const keep = new Set(visible.map((item) => item.key));

    for (const [key, row] of rowByKey) {
      if (!keep.has(key) && row.isConnected) row.remove();
    }
    for (const item of items) {
      if (!keep.has(item.key)) continue;
      let row = rowByKey.get(item.key);
      if (!row) {
        row = buildRow(item);
        rowByKey.set(item.key, row);
      }
      updateRow(row, item);
    }

    const empty = listEl.querySelector('.empty');
    if (empty) empty.remove();

    if (!visible.length) {
      rowByKey.forEach((row) => { if (row.isConnected) row.remove(); });
      const isFiltered = items.length > 0;
      const copy = isFiltered
        ? ['没有匹配的端口', '调整搜索词或筛选条件，所有端口仍在清单内。']
        : ['没有监听的端口', '本机当前没有可显示的端口服务，下一次扫描会自动更新。'];
      listEl.replaceChildren(emptyState(copy[0], copy[1]));
      updateVisibleCount();
      return;
    }

    let ref = listEl.firstElementChild;
    visible.forEach((item) => {
      const row = rowByKey.get(item.key);
      if (row === ref) {
        ref = ref.nextElementSibling;
      } else {
        listEl.insertBefore(row, ref);
      }
    });
    updateVisibleCount();
    scheduleEntrance();
  }

  function normalize(data) {
    const services = Array.isArray(data.services) ? data.services : [];
    const ports = Array.isArray(data.ports) ? data.ports : [];
    const out = [];

    services.forEach((svc) => {
      const port = Number(svc.port);
      out.push({
        key: `service:${svc.id}`,
        id: svc.id,
        port: Number.isFinite(port) ? port : svc.port,
        name: svc.name || `端口 ${svc.port}`,
        command: svc.command || '',
        cwd: svc.cwd || '',
        note: svc.note || '',
        status: svc.status || 'stopped',
        pid: svc.pid || null,
        uptime: svc.uptime || '',
        url: svc.url || '',
        fallback: false,
        managed: true,
      });
    });

    ports.forEach((p) => {
      if (p.managedId) return;
      const port = Number(p.port);
      out.push({
        key: `port:${port}:${p.pid || ''}`,
        id: null,
        port: Number.isFinite(port) ? port : p.port,
        name: p.process || p.name || `端口 ${p.port}`,
        command: p.command || '',
        cwd: p.cwd || '',
        note: '',
        status: 'running',
        pid: p.pid || null,
        uptime: '',
        url: '',
        fallback: true,
        managed: false,
      });
    });

    return out.sort((a, b) => {
      const ap = Number(a.port), bp = Number(b.port);
      if (Number.isFinite(ap) && Number.isFinite(bp) && ap !== bp) return ap - bp;
      return String(a.name).localeCompare(String(b.name), 'zh-Hans-CN');
    });
  }

  function decorate(item) {
    item.haystack = [item.name, item.command, item.cwd, item.port, item.pid].filter(Boolean).join(' ').toLowerCase();
    const meta = [];
    if (item.status === 'running' || item.status === 'starting') {
      if (item.pid) meta.push(`PID ${item.pid}`);
      if (item.uptime) meta.push(item.uptime);
    } else {
      meta.push('未监听');
    }
    item.meta = meta.join(' · ');
    return item;
  }

  async function getJSON(url, options) {
    const res = await fetch(url, options);
    let data = null;
    try { data = await res.json(); } catch (_) {}
    if (!res.ok) {
      const message = data && (data.error || data.detail) ? (data.error || data.detail) : `请求失败（${res.status}）`;
      throw new Error(message);
    }
    return data && data.data !== undefined ? data.data : (data || {});
  }

  async function load() {
    try {
      const scanData = await getJSON('/api/scan');
      const stateData = await getJSON('/api/state');
      const next = normalize({ ...stateData, ports: scanData.ports || [] }).map(decorate);
      items = next;
      itemByKey = new Map(items.map((item) => [item.key, item]));
      loaded = true;

      const keepKeys = new Set(items.map((item) => item.key));
      for (const [key, row] of rowByKey) {
        if (!keepKeys.has(key)) {
          if (row.isConnected) row.remove();
          rowByKey.delete(key);
        }
      }

      hostEl.textContent = window.location.host || '127.0.0.1:4318';
      const now = new Date().toLocaleTimeString('zh-CN', { hour12: false });
      updateText('[data-sync]', now);
      updateCounts();
      renderSegments();
      renderList();

      if (!deepLinkChecked) {
        deepLinkChecked = true;
        const logId = new URLSearchParams(location.search).get('log');
        if (logId) {
          const item = items.find((entry) => entry.id === logId);
          if (item) openConsole(item, null);
        }
      }

      if (lastError) lastError = '';
      if (!refreshTimer) refreshTimer = window.setInterval(() => { if (!busy) load(); }, 4000);
    } catch (error) {
      if (error.message !== lastError) {
        lastError = error.message;
        notify(error.message, true);
      }
      if (!loaded) {
        listEl.replaceChildren(emptyState('暂时无法读取端口', '后端服务可能尚未启动，确认应用正在运行后会再次尝试。'));
      }
    }
  }

  function notify(message, isError = false) {
    window.clearTimeout(toastTimer);
    toastEl.textContent = message;
    toastEl.classList.toggle('error', isError);
    toastEl.classList.add('on');
    toastTimer = window.setTimeout(() => toastEl.classList.remove('on'), isError ? 4200 : 2600);
  }

  async function doAction(item, action) {
    if (!item || busy) return;
    busy = true;
    updateCounts();
    renderList();
    try {
      if (item.managed && item.id) {
        await getJSON('/api/action', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id: item.id, action }),
        });
      } else if (item.fallback) {
        if (action !== 'kill') throw new Error('该端口只能清理进程');
        await getJSON('/api/scan/kill', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ port: Number(item.port) }),
        });
      } else {
        throw new Error('该端口没有可用的管理入口');
      }
      notify(actionText[action] || '操作完成');
      await load();
    } catch (error) {
      notify(error.message, true);
    } finally {
      busy = false;
      updateCounts();
      renderList();
    }
  }

  async function runAll(action) {
    if (busy || !items.length) return;
    if (action === 'stop') {
      const count = items.filter((i) => i.managed && i.status === 'running').length;
      const ok = await askConfirm('停止全部服务？', `将停止当前 ${count} 个正在运行的服务。未运行的服务不受影响。`, '停止全部');
      if (!ok) return;
    }
    busy = true;
    updateCounts();
    renderList();
    try {
      await getJSON('/api/all', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action }),
      });
      notify(action === 'start' ? '已启动全部服务' : '已停止全部服务');
      await load();
    } catch (error) {
      notify(error.message, true);
    } finally {
      busy = false;
      updateCounts();
      renderList();
    }
  }

  function askConfirm(title, body, okLabel) {
    confirmTitle.textContent = title;
    confirmBody.textContent = body;
    const okBtn = confirmEl.querySelector('[value="ok"]');
    const cancelBtn = confirmEl.querySelector('[value="cancel"]');
    okBtn.textContent = okLabel || '确认';
    cancelBtn.textContent = '取消';
    confirmEl.returnValue = '';
    confirmEl.showModal();
    cancelBtn.focus();
    return new Promise((resolve) => { confirmResolve = resolve; });
  }

  confirmEl.addEventListener('close', () => {
    const resolve = confirmResolve;
    confirmResolve = null;
    if (resolve) resolve(confirmEl.returnValue === 'ok');
  });

  confirmEl.addEventListener('click', (event) => {
    if (event.target === confirmEl) confirmEl.close('cancel');
  });

  function syncLogParam(id) {
    const url = new URL(location.href);
    if (id) url.searchParams.set('log', id);
    else url.searchParams.delete('log');
    history.replaceState(null, '', `${url.pathname}${url.search}${url.hash}`);
  }

  function openConsole(item, trigger) {
    if (!item) return;
    activeLogKey = item.key;
    logTrigger = trigger || null;
    if (item.id) syncLogParam(item.id);
    consoleTitle.textContent = item.name;
    consolePort.textContent = `:${item.port}`;
    logBody.textContent = '正在读取日志…';
    document.body.classList.add('console-open');
    scrimEl.classList.add('on');
    consoleEl.classList.add('on');
    topbarEl.inert = true;
    pageEl.inert = true;
    window.clearInterval(logTimer);
    fetchLog();
    logTimer = window.setInterval(fetchLog, 1500);
    window.setTimeout(() => {
      if (consoleEl.classList.contains('on')) consoleClose.focus();
    }, 320);
  }

  function closeConsole() {
    if (!consoleEl.classList.contains('on')) return;
    activeLogKey = null;
    drag = null;
    window.clearInterval(logTimer);
    logTimer = null;
    consoleEl.classList.remove('on');
    scrimEl.classList.remove('on');
    document.body.classList.remove('console-open');
    topbarEl.inert = false;
    pageEl.inert = false;
    consoleEl.style.transform = '';
    consoleEl.style.transition = '';
    if (logTrigger && logTrigger.isConnected) logTrigger.focus();
    else if (searchInput) searchInput.focus({ preventScroll: true });
    logTrigger = null;
    syncLogParam(null);
  }

  async function fetchLog() {
    if (!activeLogKey) return;
    const item = itemByKey.get(activeLogKey);
    if (!item) return;
    const nearBottom = logBody.scrollHeight - logBody.scrollTop - logBody.clientHeight < 48;
    try {
      const data = item.managed && item.id
        ? await getJSON(`/api/logs?id=${encodeURIComponent(item.id)}&lines=400`)
        : { text: '该端口由系统进程监听，暂无日志。', exists: false };
      const text = data.text || data.log || (data.exists === false ? '暂无日志输出。' : '等待日志输出…');
      logBody.textContent = text;
      if (nearBottom) logBody.scrollTop = logBody.scrollHeight;
    } catch (error) {
      logBody.textContent = `读取日志失败：${error.message}`;
    }
  }

  async function reveal(item) {
    if (!item || !item.cwd) return;
    try {
      await getJSON('/api/reveal', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(item.managed && item.id
          ? { kind: 'service', id: item.id }
          : { kind: 'port', port: Number(item.port) }),
      });
      notify('已在访达中打开项目目录');
    } catch (error) {
      notify(error.message, true);
    }
  }

  function updateFilterUI() {
    document.querySelectorAll('.seg').forEach((seg) => {
      const on = seg.dataset.filter === filter;
      seg.classList.toggle('is-on', on);
      seg.setAttribute('aria-pressed', String(on));
    });
  }

  // pointer drag on the console's grab handle
  consoleGrab.addEventListener('pointerdown', (event) => {
    if (!consoleEl.classList.contains('on')) return;
    if (event.button != null && event.button !== 0) return;
    drag = {
      startY: event.clientY,
      pointerId: event.pointerId,
      startT: performance.now(),
      dy: 0,
    };
    consoleEl.style.transition = 'none';
    consoleGrab.setPointerCapture(event.pointerId);
  });

  consoleGrab.addEventListener('pointermove', (event) => {
    if (!drag || event.pointerId !== drag.pointerId) return;
    const dy = Math.max(0, event.clientY - drag.startY);
    drag.dy = dy;
    consoleEl.style.transform = `translateY(${dy}px)`;
  });

  function snapBack() {
    consoleEl.style.transition = 'transform .22s var(--ease-out)';
    consoleEl.style.transform = '';
    window.setTimeout(() => {
      if (!drag) consoleEl.style.transition = '';
    }, 260);
  }

  function endDrag(event) {
    if (!drag || event.pointerId !== drag.pointerId) return;
    const elapsed = Math.max(1, performance.now() - drag.startT);
    const velocity = drag.dy / elapsed;
    const shouldClose = drag.dy > 108 || (drag.dy > 24 && velocity > .11);
    const pointerId = drag.pointerId;
    drag = null;
    try { consoleGrab.releasePointerCapture(pointerId); } catch (_) {}
    if (shouldClose) {
      consoleEl.style.transition = '';
      consoleEl.style.transform = '';
      closeConsole();
    } else {
      snapBack();
    }
  }

  function cancelDrag(event) {
    if (!drag || event.pointerId !== drag.pointerId) return;
    const pointerId = drag.pointerId;
    drag = null;
    try { consoleGrab.releasePointerCapture(pointerId); } catch (_) {}
    snapBack();
  }

  consoleGrab.addEventListener('pointerup', endDrag);
  consoleGrab.addEventListener('pointercancel', cancelDrag);

  // list interactions
  listEl.addEventListener('click', (event) => {
    const button = event.target.closest('button[data-act]');
    if (!button) return;
    const row = button.closest('.row');
    if (!row) return;
    const item = itemByKey.get(row.dataset.key);
    if (!item) return;
    const act = button.dataset.act;

    if (act === 'logs') return openConsole(item, button);
    if (act === 'reveal') return reveal(item);
    if (act === 'open') {
      if (item.url) window.open(item.url, '_blank', 'noopener');
      return;
    }
    if (act === 'stop' && !item.managed) {
      askConfirm('停止这个端口？', `端口 :${item.port} 没有可用的启动命令，停止会结束正在监听该端口的进程。`, '停止').then((ok) => {
        if (ok) doAction(item, 'kill');
      });
      return;
    }
    if (act === 'kill') {
      askConfirm('停止这个端口？', `端口 :${item.port} 没有可用的启动命令，停止会结束正在监听该端口的进程。`, '停止').then((ok) => {
        if (ok) doAction(item, 'kill');
      });
      return;
    }
    doAction(item, act);
  });

  document.querySelectorAll('.seg').forEach((seg) => {
    seg.addEventListener('click', () => {
      filter = seg.dataset.filter || 'all';
      updateFilterUI();
      renderList();
    });
  });

  hideSysEl.addEventListener('change', renderList);

  searchEl.addEventListener('input', () => {
    window.clearTimeout(searchTimer);
    searchTimer = window.setTimeout(() => {
      keyword = searchEl.value.trim().toLowerCase();
      renderList();
    }, 100);
  });

  document.addEventListener('keydown', (event) => {
    if (event.key === '/' && !event.metaKey && !event.ctrlKey && !event.altKey) {
      const target = event.target;
      const isText = target && (target.tagName === 'INPUT' || target.tagName === 'TEXTAREA' || target.isContentEditable);
      if (!isText && !confirmEl.open && !consoleEl.classList.contains('on')) {
        event.preventDefault();
        searchEl.focus();
        searchEl.select();
      }
    }
    if (event.key === 'Escape') {
      if (consoleEl.classList.contains('on')) {
        event.preventDefault();
        closeConsole();
      } else if (document.activeElement === searchEl) {
        if (searchEl.value) {
          searchEl.value = '';
          keyword = '';
          renderList();
        } else {
          searchEl.blur();
        }
      }
    }
  });

  // focus stays inside the log console
  consoleEl.addEventListener('keydown', (event) => {
    if (event.key !== 'Tab') return;
    const focusables = consoleEl.querySelectorAll('button, [tabindex]:not([tabindex="-1"])');
    if (!focusables.length) return;
    const first = focusables[0];
    const last = focusables[focusables.length - 1];
    if (event.shiftKey && document.activeElement === first) {
      event.preventDefault();
      last.focus();
    } else if (!event.shiftKey && document.activeElement === last) {
      event.preventDefault();
      first.focus();
    }
  });

  consoleClose.addEventListener('click', closeConsole);
  scrimEl.addEventListener('click', closeConsole);

  startAllBtn.addEventListener('click', () => runAll('start'));
  stopAllBtn.addEventListener('click', () => runAll('stop'));

  updateFilterUI();
  load();
})();
</script>
</body>
</html>
